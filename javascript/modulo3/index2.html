<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area {
            font-size: 20pt;
            font-family: Arial, Helvetica, sans-serif;
            background-color: green;
            color: aliceblue;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main>
        <div id="area">
            <p>Interaja...</p>
        </div>
    </main>

    <script>

        var a = window.document.getElementById('area')

        // Declarando os ventos 
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)


        // Evento de clicar 
        function clicar() {
            a.innerText = 'Clicou!!'
            a.style.background = 'red'
        }

        // Evento de passar o mouse em cima
        function entrar() {
            a.innerText = 'Entrou!!'
        }

        // Evento de sair com o mouse de cima
        function sair() {
            a.innerText = 'Saiu!!'
            a.style.background = 'green'
        }

    </script>
</body>

</html>
