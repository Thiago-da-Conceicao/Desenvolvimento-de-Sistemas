<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarto Document</title>
    <style>
        body{
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <script>
        var nome = window.prompt('Qual é o seu nome?')
        document.write(`Olá, ${nome}! Seu nome tem ${nome.length} letras <br><br>`) 
        document.write(`Seu nome em maiúsculo: ${nome.toUpperCase()}<br><br>`)
        document.write(`Seu nome em minúsculo: ${nome.toLowerCase()}`)
    </script>
    
</body>
</html>
