<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terceiro Document</title>
</head>

<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!!</p>

    <script>
        //prompt sempre retorna o valor como um string
        var n1 = Number (window.prompt ('Digite um número: ')) // Number || Number.parseInt || Number.parseFloat converte a variável string em number
        var n2 = Number (window.prompt ('Digite outro número: ')) // Number || Number.parseInt || Number.parseFloat converte a variável string em number
        var s = n1 + n2
        window.alert (`A soma de ${n1} e ${n2} é: ${s}`) // `${variável}` chama a variável desejada
        // (number + number) para adição
        // (string + string) para concatenação 
        // Para converter para string 
        // String(variável) || variável.toString()

    </script>
</body>

</html>
