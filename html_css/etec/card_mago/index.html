<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cartão de Personagem</title>
  <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- 🎮 Bem-vindo(a)! Você vai criar o CARTÃO DE PERSONAGEM do seu jogo. -->
  <!-- Todo mundo começa com o mesmo HTML, mas o CSS de cada um vai ficar diferente. Solte a criatividade! -->

  <main class="cartao" id="cartao-personagem">

    <div class="avatar">🧙‍♂️</div>

    <h1 class="nome">Alvo Dumbledore</h1>
    <p class="classe">Mago</p>

    <div class="barra-fundo">
      <div class="barra-vida"></div>
    </div>

    <div class="barra-fundo">
      <div class="barra-xp"></div>
    </div>

    <ul class="atributos">
      <li class="atributo">⚔️ Força: 99</li>
      <li class="atributo">🛡️ Defesa: 99</li>
      <li class="atributo">💨 Veloc: 99</li>
    </ul>

    <p class="descricao">
      "Palavras são, na minha nada humilde opinião, nossa inesgotável fonte de magia. Capazes de formar grandes
      sofrimentos e também de remediá-los."
    </p>

    <div class="nivel">
      <span>Nível 100</span>
    </div>


    <button class="botao-acao">Atacar!</button>



  </main>

</body>

</html>
